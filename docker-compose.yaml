version: "3.3"

services:
  java:
    # Ubuntu 22.04 (jammy) base: the newer Ubuntu base of the default tags needs syscalls that older
    # Docker engines block (tar fails with "Function not implemented")
    image: eclipse-temurin:${JAVA_VERSION}-jdk-jammy
    working_dir: /app
    environment:
      BUILD_TYPE: ${BUILD_TYPE}
      STRESS_ARGS: ${STRESS_ARGS}
      USER_ID: ${USER_ID}
      GROUP_ID: ${GROUP_ID}
    volumes:
      - "./:/app"
      - "${HOME}/.m2:/home/webtrekk/.m2"
      - "${HOME}/.gnupg:/home/webtrekk/.gnupg"
    entrypoint: ./java-entrypoint.sh

  shop:
    image: tomcat:8.5.40-jre8
    working_dir: /app
    environment:
      USER_ID: ${USER_ID}
      GROUP_ID: ${GROUP_ID}
    ports:
      - "8081:8080"
      - "8443:8443"
    volumes:
      - "./:/app"
      - "./shop-example/ssl:/usr/local/tomcat/ssl"
      - "./shop-example/server.xml:/usr/local/tomcat/conf/server.xml"
    entrypoint: ./demo-entrypoint.sh
